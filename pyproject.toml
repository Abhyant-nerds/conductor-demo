[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-aao-demo"
version = "0.1.0"
description = "Local Conductor OSS AAO proof of concept"
requires-python = ">=3.10"
dependencies = ["conductor-python==1.5.1"]

[project.scripts]
aao = "conductor_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
